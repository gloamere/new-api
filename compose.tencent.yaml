name: new-api-tencent
services:
  new-api:
    image: ${NEW_API_IMAGE:?set an immutable main image tag}
    container_name: new-api-tencent
    restart: unless-stopped
    env_file: /opt/new-api/runtime.env
    environment:
      TZ: Asia/Shanghai
      NODE_NAME: tencent-new-api
      BATCH_UPDATE_ENABLED: 'true'
      ERROR_LOG_ENABLED: 'true'
      DEFAULT_LANGUAGE: zh-CN
    ports:
      - '127.0.0.1:13000:3000'
    volumes:
      - /opt/new-api/data:/data
      - /opt/new-api/logs:/app/logs
    command: ['--log-dir', '/app/logs']
    mem_limit: 1536m
    cpus: 1.5
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:3000/api/status | grep -q ''"success":true''']
      interval: 30s
      timeout: 10s
      retries: 5
  postgres:
    image: mirror.ccs.tencentyun.com/library/postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    container_name: new-api-tencent-postgres
    restart: unless-stopped
    env_file: /opt/new-api/postgres.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 768m
    cpus: 1
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U newapi -d newapi']
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  pgdata:
